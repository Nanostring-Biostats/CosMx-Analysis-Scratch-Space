[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HierAnnot"
version = "0.8.43"
description = "Hierarchical cell type annotation from cluster-mean expression profiles using competitive marker-program scoring."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  {name = "Lidan Wu", email = "lidan.wu@bruker.com"}
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5"
]

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["hierannot*"]


[project.optional-dependencies]
preprocessing = [
  "anndata>=0.9",
  "scikit-learn>=1.2",
  "scanpy>=1.10.3",
  "scipy>=1.9",
  "matplotlib>=3.7"
]
