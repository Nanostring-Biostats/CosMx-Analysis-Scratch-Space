# .github/workflows/preview.yml
name: PR Preview

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # JOB 1: THE GATEKEEPER
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Check if user is approved
        run: |
          if ! contains(fromJSON('${{ secrets.APPROVED_USERS }}'), '${{ github.actor }}'); then
            echo "User '${{ github.actor }}' is not approved. Aborting."
            exit 1
          fi
          echo "User '${{ github.actor }}' is approved. Proceeding."

  # JOB 2: BUILD THE SITE
  build:
    runs-on: ubuntu-latest
    needs: authorize
    permissions:
      pages: write
      pull-requests: write
    
    steps:
      - name: Check out repository (base)
        uses: actions/checkout@v4

      - name: Check out PR code (head)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.30

      - name: Install GLPK development
        run: |
          sudo apt-get update
          sudo apt install libglpk-dev

      - name: Install libgsl
        run: |
          sudo apt-get install libgsl-dev

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
      
      - name: Install tinytex
        run: |
          quarto install tinytex
      
      - name: Install R Dependencies (from renv.lock)
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - name: Render Quarto Website
        run: |
          quarto render

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
      
      - name: Find Comment
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Your PR preview is ready!'
          
      - name: Create or Update Comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
          body: |
            ### Your PR preview is ready! 🚀
            
            Once the 'deploy' job finishes, your preview will be available at the URL below.
            
            > [!NOTE]
            > This URL will be updated with every new push to this PR. The preview will be automatically deleted when the PR is closed.

  # JOB 3: DEPLOY THE PREVIEW
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      pull-requests: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
      - name: Find Comment
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Your PR preview is ready!'
          
      - name: Update Comment with Preview URL
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
          body: |
            ### Your PR preview is ready! 🚀
            
            You can view the live preview of your changes here:
            **${{ steps.deployment.outputs.page_url }}**
            
            > [!NOTE]
            > This URL will be updated with every new push to this PR. The preview will be automatically deleted when the PR is closed.