# .github/workflows/preview.yml
name: PR Preview to Separate Repo

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [Main]

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Check if user is approved
        run: |
          if ! ${{ contains(fromJSON(secrets.APPROVED_USERS), github.actor) }}; then
            echo "User '${{ github.actor }}' is not approved. Aborting."
            exit 1
          fi
          echo "User '${{ github.actor }}' is approved. Proceeding."

  build_and_deploy_preview:
    runs-on: ubuntu-latest
    needs: authorize
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.30

      - name: Install GLPK and GSL development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libglpk-dev libgsl-dev

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
      
      - name: Install tinytex
        run: |
          quarto install tinytex
      
      - name: Install R Dependencies (from renv.lock)
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 2
          
      - name: Install quarto-live extension
        run: |
          quarto add r-wasm/quarto-live --no-prompt
          sed -i 's#REPLACEME#{{< include ./_extensions/r-wasm/live/_knitr.qmd >}}g' ./bbytes/de_explorer/index.qmd

      - name: Render Quarto Website
        run: quarto render

      - name: Deploy to preview repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAT_TOKEN }}
          external_repository: Nanostring-Biostats/blog-previews
          publish_branch: main
          publish_dir: ./_site
          destination_dir: pr-${{ github.event.pull_request.number }}
          keep_files: true
          commit_message: "Preview for PR #${{ github.event.pull_request.number }}"

      - name: Post preview link as a comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### ✅ PR Preview Ready
            Your preview is now available at:
            https://nanostring-biostats.github.io/blog-previews/pr-${{ github.event.pull_request.number }}